{% extends 'registration/base.html' %}

{% block password_page_title %}Password updated{% endblock %}

{% block registration_content %}
<h1>Password updated</h1>
<p class="password-page__intro">Your password has been changed. You can now sign in using your new password.</p>
<a class="password-page__submit" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="{% url 'show_login' %}">Go to sign in</a>
{% endblock %}
